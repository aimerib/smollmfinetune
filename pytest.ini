[pytest]
pythonpaths = . backend
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    llm: marks tests that require LLM calls (deselect with '-m "not llm"')
    fast: marks tests as fast/unit tests
    evaluation: marks tests related to evaluation harness
    ui: marks tests for UI components
    api: marks tests that require API access
    expensive: marks tests that consume significant resources (time/money) 
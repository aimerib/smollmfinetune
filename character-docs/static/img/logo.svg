<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="characterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle representing the world -->
  <circle cx="100" cy="100" r="90" fill="url(#characterGradient)" opacity="0.1"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#characterGradient)" stroke-width="3"/>
  
  <!-- Character head silhouette -->
  <path d="M100 40 C120 40, 140 55, 140 80 L140 110 C140 130, 125 145, 100 145 C75 145, 60 130, 60 110 L60 80 C60 55, 80 40, 100 40 Z" 
        fill="url(#innerGradient)" opacity="0.9"/>
  
  <!-- Neural network connections -->
  <g opacity="0.6">
    <line x1="100" y1="90" x2="70" y2="60" stroke="url(#characterGradient)" stroke-width="2"/>
    <line x1="100" y1="90" x2="130" y2="60" stroke="url(#characterGradient)" stroke-width="2"/>
    <line x1="100" y1="90" x2="100" y2="50" stroke="url(#characterGradient)" stroke-width="2"/>
    <line x1="100" y1="90" x2="70" y2="120" stroke="url(#characterGradient)" stroke-width="2"/>
    <line x1="100" y1="90" x2="130" y2="120" stroke="url(#characterGradient)" stroke-width="2"/>
    
    <circle cx="70" cy="60" r="4" fill="url(#characterGradient)"/>
    <circle cx="130" cy="60" r="4" fill="url(#characterGradient)"/>
    <circle cx="100" cy="50" r="4" fill="url(#characterGradient)"/>
    <circle cx="70" cy="120" r="4" fill="url(#characterGradient)"/>
    <circle cx="130" cy="120" r="4" fill="url(#characterGradient)"/>
    <circle cx="100" cy="90" r="6" fill="url(#innerGradient)"/>
  </g>
  
  <!-- Memory dots -->
  <g opacity="0.4">
    <circle cx="50" cy="150" r="3" fill="url(#characterGradient)"/>
    <circle cx="65" cy="155" r="3" fill="url(#characterGradient)"/>
    <circle cx="80" cy="160" r="3" fill="url(#characterGradient)"/>
    <circle cx="120" cy="160" r="3" fill="url(#characterGradient)"/>
    <circle cx="135" cy="155" r="3" fill="url(#characterGradient)"/>
    <circle cx="150" cy="150" r="3" fill="url(#characterGradient)"/>
  </g>
</svg>
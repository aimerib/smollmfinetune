<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#faviconGradient)"/>
  
  <!-- Character silhouette -->
  <g transform="translate(32, 32)">
    <!-- Head -->
    <circle cx="0" cy="-8" r="10" fill="white" opacity="0.9"/>
    <!-- Body -->
    <ellipse cx="0" cy="8" rx="8" ry="12" fill="white" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="-3" cy="-8" r="2" fill="#667eea"/>
    <circle cx="3" cy="-8" r="2" fill="#667eea"/>
    <!-- Smile -->
    <path d="M -4,-4 Q 0,-2 4,-4" stroke="#764ba2" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg> 
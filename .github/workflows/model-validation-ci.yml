name: Model Validation CI

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'evaluation-slow'
        type: choice
        options:
        - evaluation-slow
        - slow
        - all

jobs:
  model-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # LLM tests can take time
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest-xdist
    
    - name: Set up environment variables
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
        # Add other model/API keys as needed
    
    - name: Run model validation tests
      run: |
        chmod +x scripts/run_tests.sh
        ./scripts/run_tests.sh ${{ github.event.inputs.test_suite }}
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: model-validation-results
        path: |
          evaluation_results.json
          test_output/ 
events {
    worker_connections 1024;
}

http {
    upstream platform_client {
        server platform-client-1:3000;
        server platform-client-2:3000;
    }
    
    upstream platform_api {
        server platform-api-1:8000;
        server platform-api-2:8000;
    }
    
    upstream inference_engine {
        server inference-engine:8000;
    }

    # Rate limiting zones (relaxed for development)
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=websocket:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=chat:10m rate=500r/m;

    # Main server
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # React Client (main app)
        location / {
            proxy_pass http://platform_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API routes
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://platform_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers for development
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
        }

        # WebSocket routes
        location /ws/ {
            limit_req zone=websocket burst=20 nodelay;
            
            proxy_pass http://platform_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat API (higher rate limit)
        location /api/v1/chat/ {
            limit_req zone=chat burst=100 nodelay;
            
            proxy_pass http://platform_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Inference Engine
        location /inference/ {
            proxy_pass http://inference_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Monitoring dashboard (direct access)
        location /monitoring {
            proxy_pass http://platform_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Direct service access for debugging
    server {
        listen 8080;
        server_name localhost;

        location /client1/ {
            proxy_pass http://platform-client-1:3000/;
        }

        location /client2/ {
            proxy_pass http://platform-client-2:3000/;
        }

        location /api1/ {
            proxy_pass http://platform-api-1:8000/;
        }

        location /api2/ {
            proxy_pass http://platform-api-2:8000/;
        }

        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000/;
        }

        location /kibana/ {
            proxy_pass http://kibana:5601/;
        }

        location /flower/ {
            proxy_pass http://flower:5555/;
        }
    }
} 